<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Symulator Rzutu Ukośnego</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #startBtn { background: #27ae60; color: white; }
        #startBtn:hover { background: #219653; }
        #pauseBtn { background: #f39c12; color: white; }
        #pauseBtn:hover { background: #d68910; }
        #resetBtn { background: #c0392b; color: white; }
        #resetBtn:hover { background: #962d22; }

        canvas {
            display: block;
            background: #ffffff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            margin: 0 auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 15px;
            background: #eef2f3;
            padding: 10px;
            border-radius: 6px;
        }
        .stats span {
            font-weight: bold;
            color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Symulator Rzutu Ukośnego</h1>
        
        <div class="controls">
            <div class="control-group">
                <label for="v0">Prędkość początkowa (<i>v</i><sub>0</sub>): <span id="v0Val">20</span> m/s</label>
                <input type="range" id="v0" min="5" max="50" value="20" step="1">
            </div>
            <div class="control-group">
                <label for="angle">Kąt rzutu (α): <span id="angleVal">45</span>°</label>
                <input type="range" id="angle" min="0" max="90" value="45" step="1">
            </div>
            <div class="control-group">
                <label for="h0">Wysokość początkowa (<i>h</i><sub>0</sub>): <span id="h0Val">0</span> m</label>
                <input type="range" id="h0" min="0" max="50" value="0" step="1">
            </div>
        </div>

        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="pauseBtn">Pauza</button>
            <button id="resetBtn">Reset</button>
        </div>

        <canvas id="simCanvas" width="840" height="450"></canvas>

        <div class="stats">
            <div>Czas: <span id="timeStat">0.00</span> s</div>
            <div>Zasięg: <span id="rangeStat">0.00</span> m</div>
            <div>Max wys.: <span id="maxHStat">0.00</span> m</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const v0Slider = document.getElementById('v0');
        const angleSlider = document.getElementById('angle');
        const h0Slider = document.getElementById('h0');

        const v0Val = document.getElementById('v0Val');
        const angleVal = document.getElementById('angleVal');
        const h0Val = document.getElementById('h0Val');

        const timeStat = document.getElementById('timeStat');
        const rangeStat = document.getElementById('rangeStat');
        const maxHStat = document.getElementById('maxHStat');

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        const g = 9.81; // m/s^2
        let animationId = null;
        let isRunning = false;
        let t = 0;
        let trajectory = [];

        // Skala i przesunięcie układu współrzędnych
        const scale = 8; // piksele na metr
        const originX = 50;
        const originY = canvas.height - 40;

        function getParams() {
            return {
                v0: parseFloat(v0Slider.value),
                angle: parseFloat(angleSlider.value) * Math.PI / 180,
                h0: parseFloat(h0Slider.value)
            };
        }

        function updateLabels() {
            v0Val.textContent = v0Slider.value;
            angleVal.textContent = angleSlider.value;
            h0Val.textContent = h0Slider.value;
        }

        function calculateMaxValues() {
            const { v0, angle, h0 } = getParams();
            const vx = v0 * Math.cos(angle);
            const vy = v0 * Math.sin(angle);
            
            // Czas lotu z równania kwadratowego: -0.5*g*t^2 + vy*t + h0 = 0
            const delta = vy * vy + 2 * g * h0;
            const tFlight = (vy + Math.sqrt(delta)) / g;
            const range = vx * tFlight;
            
            // Maksymalna wysokość
            let maxH = h0;
            if (vy > 0) {
                const tMaxH = vy / g;
                if (tMaxH <= tFlight) {
                    maxH = h0 + vy * tMaxH - 0.5 * g * tMaxH * tMaxH;
                }
            }

            rangeStat.textContent = range.toFixed(2);
            maxHStat.textContent = maxH.toFixed(2);
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Oś X i Y
            ctx.strokeStyle = '#bdc3c7';
            ctx.lineWidth = 1;
            ctx.beginPath();
            // Oś X
            ctx.moveTo(originX, originY);
            ctx.lineTo(canvas.width - 20, originY);
            // Oś Y
            ctx.moveTo(originX, originY);
            ctx.lineTo(originX, 20);
            ctx.stroke();

            // Podziałka co 10 metrów
            ctx.fillStyle = '#7f8c8d';
            ctx.font = '12px sans-serif';
            for (let m = 10; m * scale < canvas.width - originX - 30; m += 10) {
                let x = originX + m * scale;
                ctx.beginPath();
                ctx.moveTo(x, originY - 4);
                ctx.lineTo(x, originY + 4);
                ctx.stroke();
                ctx.fillText(m + 'm', x - 10, originY + 20);
            }

            for (let m = 10; originY - m * scale > 20; m += 10) {
                let y = originY - m * scale;
                ctx.beginPath();
                ctx.moveTo(originX - 4, y);
                ctx.lineTo(originX + 4, y);
                ctx.stroke();
                ctx.fillText(m + 'm', originX - 35, y + 4);
            }
        }

        function drawScene() {
            drawGrid();

            const { v0, angle, h0 } = getParams();
            const vx = v0 * Math.cos(angle);
            const vy = v0 * Math.sin(angle);

            // Rysowanie pełnej teoretycznej trajektorii
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            let started = false;
            let delta = vy * vy + 2 * g * h0;
            let tMax = (vy + Math.sqrt(delta)) / g;
            
            for (let time = 0; time <= tMax; time += 0.05) {
                let x = vx * time;
                let y = h0 + vy * time - 0.5 * g * time * time;
                let px = originX + x * scale;
                let py = originY - y * scale;
                if (!started) {
                    ctx.moveTo(px, py);
                    started = true;
                } else {
                    ctx.lineTo(px, py);
                }
            }
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Aktualna pozycja i wektory w czasie t
            let x = vx * t;
            let y = h0 + vy * t - 0.5 * g * t * t;
            let px = originX + x * scale;
            let py = originY - y * scale;

            // Rysowanie punktu (pocisk)
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.arc(px, py, 6, 0, 2 * Math.PI);
            ctx.fill();

            // Wektor prędkości (vX, vY w danej chwili)
            let currVx = vx;
            let currVy = vy - g * t;
            let vScaleFactor = 1.5; // skalowanie wizualne wektora
            
            drawVector(px, py, currVx * vScaleFactor, -currVy * vScaleFactor, '#27ae60', 'v');
            // Wektor przyspieszenia (stałe g pionowo w dół)
            drawVector(px, py, 0, g * vScaleFactor * 2, '#8e44ad', 'a');

            timeStat.textContent = t.toFixed(2);
        }

        function drawVector(x, y, dx, dy, color, label) {
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + dy);
            ctx.stroke();

            // Strzałka
            const angle = Math.atan2(dy, dx);
            const headLength = 8;
            ctx.beginPath();
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - headLength * Math.cos(angle - Math.PI / 6), y + dy - headLength * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(x + dx - headLength * Math.cos(angle + Math.PI / 6), y + dy - headLength * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            // Etykieta wektora
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(label + '→', x + dx + 5, y + dy + 5);
        }

        function update() {
            const { v0, angle, h0 } = getParams();
            const vy = v0 * Math.sin(angle);
            const delta = vy * vy + 2 * g * h0;
            const tFlight = (vy + Math.sqrt(delta)) / g;

            if (t < tFlight && isRunning) {
                t += 0.03;
                if (t > tFlight) t = tFlight;
                drawScene();
                animationId = requestAnimationFrame(update);
            } else {
                isRunning = false;
            }
        }

        // Obsługa interfejsu
        [v0Slider, angleSlider, h0Slider].forEach(slider => {
            slider.addEventListener('input', () => {
                updateLabels();
                calculateMaxValues();
                if (!isRunning) {
                    t = 0;
                    drawScene();
                }
            });
        });

        startBtn.addEventListener('click', () => {
            const { v0, angle, h0 } = getParams();
            const vy = v0 * Math.sin(angle);
            const delta = vy * vy + 2 * g * h0;
            const tFlight = (vy + Math.sqrt(delta)) / g;

            if (t >= tFlight) {
                t = 0;
            }
            if (!isRunning) {
                isRunning = true;
                update();
            }
        });

        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
        });

        resetBtn.addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
            t = 0;
            drawScene();
        });

        // Inicjalizacja startowa
        updateLabels();
        calculateMaxValues();
        drawScene();
    </script>
</body>
</html>
